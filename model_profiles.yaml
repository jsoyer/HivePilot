claude_profiles:
  coding:
    model: sonnet
    grok: grok-4.6
    cursor: gpt-5.3-codex-high
    ollama: qwen2.5-coder
    # HP-71: Hermes-4 as the OpenAI-compat OSS column. OpenRouter slug for
    # the built-in `openrouter` runner; native Nous Portal name for
    # `api_provider: nous`.
    openrouter: nousresearch/hermes-4-70b
    nous: Hermes-4-70B
    # HP-19: selectable OSS columns (OpenCode Go + OpenAI-compat). Do not
    # change default roles.yaml vendors — select via HIVEPILOT_ROSTER_PRESET=oss
    # or by binding a role to runner: opencode / openai.
    # Ollama Cloud alternatives: qwen3.5:397b, kimi-k2.7-code
    opencode: kimi-k2.7-code
    openai: kimi-k2.7-code
  architecture:
    model: opus
    grok: grok-4.6
    cursor: cursor-grok-4.6-high
    ollama: llama3.1
    openrouter: nousresearch/hermes-4-405b
    nous: Hermes-4-405B
    # Ollama Cloud alternatives: deepseek-v4-flash (1M ctx), deepseek-v4-pro
    opencode: deepseek-v4-pro
    openai: deepseek-v4-pro
  automation:
    model: haiku
    grok: grok-4.5
    cursor: composer-2.5-fast
    ollama: llama3.2
    openrouter: nousresearch/hermes-4-70b
    nous: Hermes-4-70B
    # Concierge / CoS / Docs. OpenCode Go alternatives: mimo-v2.5,
    # deepseek-v4-flash. Ollama Cloud: gpt-oss:20b, nemotron-3-nano:30b
    opencode: glm-5.3-flash
    openai: glm-5.3-flash
  # Dedicated Hermes-4 profiles — bind a role with `model_profile: hermes-4`
  # (or hermes-4-405b) to use the model as primary via `runner: openrouter`
  # or `api_provider: nous`. Claude `model:` stays so a claude roster still
  # resolves.
  hermes-4:
    model: sonnet
    openrouter: nousresearch/hermes-4-70b
    nous: Hermes-4-70B
    ollama: qwen2.5-coder
  hermes-4-405b:
    model: opus
    openrouter: nousresearch/hermes-4-405b
    nous: Hermes-4-405B
    ollama: llama3.1

# Role-to-profile bindings for V4 agent roles (Phase 1 — all Claude).
# Strategy/security roles use architecture (opus); implementation/review
# roles use coding (sonnet); coordination/docs roles use automation (haiku).
role_profiles:
  ceo: architecture
  cto: architecture
  ciso: architecture
  developer: coding
  reviewer: coding
  qa: automation
  chief_of_staff: automation
  documentation: automation
