name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project + dev extras
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project + dev extras
        # `postgres` too: without psycopg installed mypy treats the entire
        # Postgres branch of db.py as Any and checks none of it. It found a
        # real assignment conflict there the moment it could see the types.
        run: pip install -e ".[dev,postgres]"

      - name: mypy
        run: python -m mypy hivepilot tests

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project + dev extras
        # dev extra includes fastapi, uvicorn, prometheus-client, itsdangerous,
        # httpx — all needed so the full 675-test suite runs without skips/errors.
        # notifications (python-telegram-bot) is also required for telegram tests.
        run: pip install -e ".[dev,notifications]"

      - name: pytest
        run: python -m pytest -q

  postgres:
    name: Test (postgres dialect)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: hivepilot
          POSTGRES_DB: hivepilot_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project + postgres extra
        run: pip install -e ".[dev,postgres]"

      - name: pytest (postgres dialect)
        env:
          HIVEPILOT_DATABASE_URL: postgresql://postgres:hivepilot@localhost:5432/hivepilot_test
        # `--no-skips`: the whole point of this job is that these tests RUN.
        # They skip themselves without a live server, so a job that silently
        # stopped providing one would go green having proven nothing -- the
        # exact "plausible zero" this job exists to end.
        run: |
          # `pipefail`: without it `$?` is tee's, so a FAILING pytest would
          # exit 0 and this job would go green having caught nothing.
          set -o pipefail
          python -m pytest tests/test_postgres_dialect.py -q -p no:randomly -rs \
            | tee /tmp/pg.txt
          # A skip is not a pass. These tests skip themselves without a live
          # server, so a job that quietly stopped providing one would prove
          # nothing while looking green -- the plausible zero this job exists
          # to end. `N skipped` only ever appears in pytest's summary line.
          if grep -qE "[0-9]+ skipped" /tmp/pg.txt; then
            echo "::error::postgres dialect tests SKIPPED - no live server reached"
            exit 1
          fi

  public-safe:
    name: Public-safe prompts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check public prompts for org-specific content
        run: python scripts/check_public_safe.py

  webui-build:
    name: Pollen web UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (pinned via web/.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build Pollen web UI
        run: npm run build
        working-directory: web

      - name: Fail if committed static/ is stale vs the source build
        run: git diff --exit-code hivepilot/webui/static

  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: helm lint
        run: helm lint deploy/helm/hivepilot

      - name: helm template (default values)
        run: helm template deploy/helm/hivepilot > /dev/null

      - name: helm template (gated paths — ingress, bots, rbac)
        run: |
          helm template deploy/helm/hivepilot \
            --set ingress.enabled=true \
            --set bots.telegram.enabled=true \
            --set bots.slack.enabled=true \
            --set bots.discord.enabled=true \
            --set rbac.create=true \
            --set rbac.scope=ClusterRole \
            --set 'config.files.projects\.yaml=projects: {}' \
            --set secrets.apiTokensYaml="tokens: []" \
            --set secrets.data.HIVEPILOT_API_TOKEN=placeholder \
            > /dev/null
